<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guitar Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tuner: {
              bg: '#0f172a', // slate-900
              surface: '#1e293b', // slate-800
              primary: '#06b6d4', // cyan-500
              success: '#22c55e', // green-500
              warning: '#eab308', // yellow-500
              danger: '#ef4444', // red-500
            }
          },
          animation: {
            'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        }
      }
    }
  </script>
  <style>
    /* Custom Needle Transition */
    .needle-transition {
      /* Smoother transform with slight ease-out to mimic inertia, plus color/shadow transitions */
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.3s ease, box-shadow 0.3s ease;
      will-change: transform;
    }

    /* Drawer Animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideInFromRight {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-slide-in {
      animation: slideInFromRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    body {
      background-color: #0f172a;
      color: white;
    }
  </style>
  <script type="module" src="/index.tsx"></script>
</head>

<body>
  <div id="root"></div>
</body>

</html>
